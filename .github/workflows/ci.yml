name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: windows-latest
    env:
      RS_PLAYWRIGHT_CORE: ${{ github.workspace }}/node_modules/playwright-core/index.mjs
      RS_PYTHON: python
      RS_TOOL_PORT: "18920"
      RS_E2E_PORT: "18921"
      RS_BROWSER_CHANNEL: msedge
      RS_CLI_HTTP_TIMEOUT: "15"
      RS_SERVER_START_TIMEOUT_MS: "15000"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install test dependencies
        run: |
          python -m pip install pytest
          npm install --no-save playwright-core@1.58.1

      - name: Python tests
        run: python -m pytest -q
      # Diagnostics for a rare net::ERR_NO_BUFFER_SPACE (WSAENOBUFS) in the
      # browser tests: samples TCP states and the non-paged pool while they run.
      - name: Start socket sampler
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'sockets.log'
          $file = Join-Path $env:RUNNER_TEMP 'sampler.ps1'
          @"
          while (`$true) {
            `$states = Get-NetTCPConnection -ErrorAction SilentlyContinue | Group-Object State | ForEach-Object { "`$(`$_.Name)=`$(`$_.Count)" }
            `$pool = (Get-Counter '\Memory\Pool Nonpaged Bytes' -ErrorAction SilentlyContinue).CounterSamples.CookedValue
            "`$(Get-Date -Format HH:mm:ss) pool_nonpaged_mb=`$([math]::Round(`$pool / 1MB)) `$(`$states -join ' ')" | Add-Content '$log'
            Start-Sleep 5
          }
          "@ | Set-Content $file
          Start-Process pwsh -WindowStyle Hidden -ArgumentList '-NoProfile', '-File', $file
          Start-Sleep 7
          Get-Content $log -ErrorAction SilentlyContinue
      - name: Node unit tests and browser smoke
        # blocking: every unit file plus a small browser smoke set (render,
        # decide by mouse and keyboard, discard, empty state, pop-up)
        run: node tools/node-tests.mjs gate
      - name: Browser e2e (advisory)
        # advisory: the full browser suite, including timing budgets, burst
        # and pop-up timing, which shared CI runners make flaky. It does not
        # fail the job; the release gate runs it on real Windows and macOS
        # machines (CONTRIBUTING.md, Release checklist). Browser files run at
        # most two at a time: several Edge/Chrome instances on one runner
        # hit WSAENOBUFS.
        continue-on-error: true
        run: node tools/node-tests.mjs browser --browser-concurrency 2
      - name: Socket sampler report
        if: always()
        shell: pwsh
        run: |
          netsh int ipv4 show dynamicport tcp
          if (Test-Path "$env:RUNNER_TEMP/sockets.log") { Get-Content "$env:RUNNER_TEMP/sockets.log" }

      - name: Source lint
        run: python tools/lint_src.py

  macos:
    name: macOS / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: macos-latest
    env:
      RS_PLAYWRIGHT_CORE: ${{ github.workspace }}/node_modules/playwright-core/index.mjs
      RS_PYTHON: python
      RS_TOOL_PORT: "18920"
      RS_E2E_PORT: "18921"
      RS_BROWSER_CHANNEL: chrome
      RS_CLI_HTTP_TIMEOUT: "15"
      RS_SERVER_START_TIMEOUT_MS: "15000"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install test dependencies
        run: |
          python -m pip install pytest
          npm install --no-save playwright-core@1.58.1

      - name: Python tests
        run: python -m pytest -q

      - name: Node unit tests and browser smoke
        # blocking: every unit file plus a small browser smoke set (render,
        # decide by mouse and keyboard, discard, empty state, pop-up)
        run: node tools/node-tests.mjs gate
      - name: Browser e2e (advisory)
        # advisory: the full browser suite, including timing budgets, burst
        # and pop-up timing, which shared CI runners make flaky. It does not
        # fail the job; the release gate runs it on real Windows and macOS
        # machines (CONTRIBUTING.md, Release checklist). Browser files run at
        # most two at a time: several Edge/Chrome instances on one runner
        # hit WSAENOBUFS.
        continue-on-error: true
        run: node tools/node-tests.mjs browser --browser-concurrency 2

      - name: Source lint
        run: python tools/lint_src.py
