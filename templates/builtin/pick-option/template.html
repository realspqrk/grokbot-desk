<div class="po" data-rs-item>
  <div class="po__lead">
    <p class="po__question" data-po="question"></p>
    <p class="po__context" data-po="context"></p>
  </div>
  <rs-action-row class="po__options" data-item="pick-option" data-po="options"></rs-action-row>
  <div class="po__extra">
    <button type="button" class="rs-link rs-on-hover" data-po="note-open" data-rs-icon="plus"><span data-rs-t="add_note"></span></button>
    <div class="po__note" data-po="note-box" hidden>
      <label class="rs-label" for="po-note"><span data-rs-t="note"></span></label>
      <textarea class="rs-input" id="po-note" maxlength="1000" rows="3" data-rs-t-placeholder="po_note_placeholder"></textarea>
    </div>
  </div>
</div>
