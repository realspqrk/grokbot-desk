<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600">
<title>Desk over a chat app</title>
<!--
  README hero scene: a dark chat desktop app, drawn as a skeleton (no real
  names, no logos), with the desk pop-up floating over it. Self-contained:
  no external requests. tools/dev/readme-shots.mjs fills #popup-shot with
  a screenshot of the real served shell; opened on its own, the pop-up frame
  shows a placeholder. The blob outline and eyes are the desk's own
  (core/static/avatar-shapes.json, shapes.blob); the script checks they match.
-->
<style>
  :root {
    --app: #0f0f0f;
    --side: #141414;
    --line: #222222;
    --sel: #1f1f1f;
    --bar: #2a2a2a;
    --bar-2: #333333;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --bubble: #1e1e1e;
    --me: #ea580c;
    --me-2: #c2410c;
    --eye: #161616;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1600px;
    height: 1000px;
    overflow: hidden;
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 78% 18%, #2a3140 0%, rgba(42, 49, 64, 0) 70%),
      radial-gradient(900px 600px at 10% 100%, #1f2430 0%, rgba(31, 36, 48, 0) 70%),
      #12141a;
    position: relative;
  }
  svg.av { display: block; flex: none; }

  /* ------------------------------------------------ the chat app window */
  .app {
    position: absolute;
    left: 36px;
    top: 32px;
    width: 1140px;
    height: 936px;
    background: var(--app);
    border: 1px solid #2b2b2b;
    border-radius: 8px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 300px 1fr;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }
  .caption {
    position: absolute;
    top: 0;
    right: 0;
    display: flex;
    z-index: 2;
  }
  .caption span {
    width: 46px;
    height: 32px;
    display: grid;
    place-items: center;
    color: #c8c8c8;
    font: 13px/1 "Segoe UI Symbol", "Segoe UI", sans-serif;
  }

  /* sidebar */
  .side {
    background: var(--side);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .side-top {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 40px 16px 0;
  }
  .round {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #222222;
    display: grid;
    place-items: center;
  }
  .pins {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 6px 0 18px;
  }
  .pin { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pin-av { position: relative; }
  .pin-av .badge {
    position: absolute;
    right: -2px;
    bottom: -2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--side);
    display: grid;
    place-items: center;
  }
  .pin-label { font-size: 12.5px; font-weight: 600; color: #e6e6e6; }
  .list { flex: 1; overflow: hidden; padding: 0 8px; }
  .group {
    font-size: 12px;
    color: var(--muted);
    padding: 12px 10px 6px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 10px;
    border-radius: 10px;
  }
  .row.sel { background: var(--sel); }
  .row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .name { font-weight: 700; font-size: 14px; color: #f4f4f4; line-height: 1.1; }
  .sk {
    display: block;
    height: 9px;
    border-radius: 5px;
    background: var(--bar);
  }
  .sk.b { background: var(--bar-2); height: 11px; }
  .side-foot {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px 16px;
    border-top: 1px solid var(--line);
  }
  .me {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #5a5a5a;
    flex: none;
  }
  .connect {
    flex: 1;
    height: 36px;
    border: 1px solid #3a3a3a;
    border-radius: 18px;
    display: grid;
    place-items: center;
    font-size: 13px;
    color: #d0d0d0;
  }

  /* chat */
  .chat { position: relative; display: flex; flex-direction: column; min-height: 0; }
  .pill {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px 6px 8px;
    background: #1c1c1c;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    z-index: 1;
  }
  .msgs {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 76px 28px 16px;
    overflow: hidden;
  }
  .when {
    align-self: center;
    font-size: 12px;
    color: var(--muted);
    padding: 8px 0 2px;
  }
  .bot {
    align-self: flex-start;
    background: var(--bubble);
    border-radius: 14px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    max-width: 560px;
  }
  .bot .sk { background: #333333; }
  .bot.text { font-size: 14.5px; color: #ececec; }
  .bot.last { margin-top: auto; }
  .mine {
    align-self: flex-end;
    background: linear-gradient(180deg, var(--me), var(--me-2));
    border-radius: 14px;
    padding: 10px 16px;
    font-size: 14.5px;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 420px;
  }
  .mine .sk { background: rgba(255, 255, 255, .55); }
  .composer {
    margin: 0 28px 22px;
    height: 54px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 27px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 8px 0 18px;
    color: var(--muted);
  }
  .composer .plus { font-size: 22px; line-height: 1; color: #cfcfcf; }
  .composer .ph { flex: 1; font-size: 14.5px; }
  .voice {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--me);
    display: grid;
    place-items: center;
  }

  /* ------------------------------------------------- the desk pop-up */
  .popup {
    position: absolute;
    left: 846px;
    top: 238px;
    width: 702px;
    background: #202020;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    overflow: hidden;
    box-shadow:
      0 40px 100px rgba(0, 0, 0, .55),
      0 12px 32px rgba(0, 0, 0, .40);
  }
  .popup-bar {
    height: 32px;
    display: flex;
    align-items: center;
    padding-left: 14px;
    font-size: 12px;
    color: #9a9a9a;
  }
  .popup-bar .title { flex: 1; }
  .popup-bar .caption { position: static; }
  .popup-bar .caption span { width: 44px; color: #b8b8b8; font-size: 12px; }
  #popup-shot {
    display: block;
    width: 700px;
    height: auto;
    min-height: 200px;
    background: #1b1b1f;
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="blob" d="M46.5 24C46.48 25.29 46.34 26.6 46.1 27.86C45.85 29.13 45.49 30.39 45.02 31.59C44.56 32.8 43.97 33.98 43.31 35.08C42.64 36.18 41.86 37.24 41.01 38.21C40.16 39.18 39.22 40.1 38.22 40.91C37.21 41.72 36.13 42.46 35 43.09C33.88 43.72 32.68 44.27 31.47 44.7C30.26 45.14 28.99 45.48 27.72 45.7C26.45 45.93 25.14 46.05 23.85 46.06C22.56 46.07 21.25 45.97 19.98 45.76C18.7 45.55 17.43 45.22 16.21 44.8C14.99 44.38 13.8 43.84 12.67 43.21C11.54 42.58 10.46 41.84 9.46 41.03C8.46 40.21 7.52 39.29 6.68 38.31C5.84 37.33 5.08 36.26 4.43 35.15C3.78 34.03 3.23 32.84 2.79 31.63C2.35 30.42 2.01 29.14 1.8 27.87C1.58 26.6 1.48 25.29 1.5 24C1.52 22.71 1.66 21.4 1.9 20.14C2.15 18.87 2.51 17.61 2.98 16.41C3.44 15.2 4.03 14.02 4.69 12.92C5.36 11.82 6.14 10.76 6.99 9.79C7.84 8.82 8.78 7.9 9.78 7.09C10.79 6.28 11.87 5.54 13 4.91C14.12 4.28 15.32 3.73 16.53 3.3C17.74 2.86 19.01 2.52 20.28 2.3C21.55 2.07 22.86 1.95 24.15 1.94C25.44 1.93 26.75 2.03 28.02 2.24C29.3 2.45 30.57 2.78 31.79 3.2C33.01 3.62 34.2 4.16 35.33 4.79C36.46 5.42 37.54 6.16 38.54 6.97C39.54 7.79 40.48 8.71 41.32 9.69C42.16 10.67 42.92 11.74 43.57 12.85C44.22 13.97 44.77 15.16 45.21 16.37C45.65 17.58 45.99 18.86 46.2 20.13C46.42 21.4 46.52 22.71 46.5 24Z"/>
    <path id="eyes" d="M29.97 22.24A6.66 2.79 56 1 0 22.53 11.2A6.66 2.79 56 1 0 29.97 22.24ZM40.5 17.31A6.57 2.25 56 1 0 33.15 6.42A6.57 2.25 56 1 0 40.5 17.31Z"/>
  </defs>
</svg>

<div class="app">
  <div class="caption" aria-hidden="true"><span>&#x2500;</span><span>&#x25A1;</span><span>&#x2715;</span></div>

  <aside class="side">
    <div class="side-top">
      <span class="round"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#cfcfcf" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4L14 14" stroke-linecap="round"/></svg></span>
      <span class="round"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#cfcfcf" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></span>
    </div>
    <div class="pins">
      <div class="pin">
        <div class="pin-av">
          <svg class="av" width="60" height="60" viewBox="0 0 48 48"><use href="#blob" fill="#f5f5f5"/><use href="#eyes" fill="#161616"/></svg>
          <span class="badge"><svg width="14" height="14" viewBox="0 0 24 24"><path fill="#ff6700" d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 16.9 5.9 20.4l1.5-6.8L2.2 9l6.9-.7z"/></svg></span>
        </div>
        <span class="pin-label">Grok Bot</span>
      </div>
      <div class="pin">
        <div class="pin-av">
          <svg class="av" width="60" height="60" viewBox="0 0 48 48"><use href="#blob" fill="#0e74e0"/><use href="#eyes" fill="#161616"/></svg>
        </div>
        <span class="sk b" style="width:54px;margin-top:3px"></span>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot">
      <span class="me"></span>
      <span class="connect">Connect apps</span>
    </div>
  </aside>

  <main class="chat">
    <div class="pill">
      <svg class="av" width="26" height="26" viewBox="0 0 48 48"><use href="#blob" fill="#ff6700"/><use href="#eyes" fill="#161616"/></svg>
      Office Bot
    </div>
    <div class="msgs">
      <span class="when">Today 10:56 AM</span>
      <div class="mine">Pay the hosting invoice?</div>
      <div class="bot"><span class="sk" style="width:400px"></span><span class="sk" style="width:340px"></span><span class="sk" style="width:220px"></span></div>
      <div class="mine"><span class="sk" style="width:160px"></span></div>
      <div class="bot"><span class="sk" style="width:380px"></span><span class="sk" style="width:260px"></span></div>
      <span class="when">Today 11:02 AM</span>
      <div class="mine"><span class="sk" style="width:210px"></span></div>
      <div class="bot"><span class="sk" style="width:360px"></span><span class="sk" style="width:300px"></span></div>
      <div class="mine"><span class="sk" style="width:180px"></span><span class="sk" style="width:120px"></span></div>
      <div class="bot"><span class="sk" style="width:420px"></span><span class="sk" style="width:390px"></span><span class="sk" style="width:180px"></span></div>
      <span class="when">Today 11:20 AM</span>
      <div class="bot"><span class="sk" style="width:330px"></span><span class="sk" style="width:270px"></span></div>
      <div class="bot text last">I put the three invoices on your desk.</div>
    </div>
    <div class="composer">
      <span class="plus">+</span>
      <span class="ph">Message Office Bot</span>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#bdbdbd" stroke-width="1.6" stroke-linecap="round"><rect x="6.2" y="2" width="5.6" height="9" rx="2.8"/><path d="M3.5 8.6a5.5 5.5 0 0 0 11 0M9 14.2V16"/></svg>
      <span class="voice"><svg width="16" height="16" viewBox="0 0 16 16" fill="#ffffff"><rect x="2" y="6" width="2" height="4" rx="1"/><rect x="5.5" y="3.5" width="2" height="9" rx="1"/><rect x="9" y="5" width="2" height="6" rx="1"/><rect x="12.5" y="6.5" width="2" height="3" rx="1"/></svg></span>
    </div>
  </main>
</div>

<div class="popup">
  <div class="popup-bar">
    <span class="title">Office Bot &middot; grokbot-desk</span>
    <span class="caption" aria-hidden="true"><span>&#x2500;</span><span>&#x25A1;</span><span>&#x2715;</span></span>
  </div>
  <img id="popup-shot" alt="">
</div>

<script>
  /* sidebar rows: avatar colour, name width, preview width; the first is real */
  const groups = [
    ['Work', [['#ff6700', 0, 150], ['#ff6700', 92, 170], ['#ff9800', 76, 140], ['#e5302f', 104, 160]]],
    ['Personal', [['#ff6700', 84, 150], ['#777777', 70, 176]]],
    ['Dev team', [['#e5302f', 96, 130], ['#8b4cf0', 80, 168], ['#1fa45a', 108, 150]]],
  ];
  const list = document.getElementById('list');
  let first = true;
  for (const [title, rows] of groups) {
    const head = document.createElement('div');
    head.className = 'group';
    head.textContent = title;
    list.append(head);
    for (const [color, nameWidth, previewWidth] of rows) {
      const row = document.createElement('div');
      row.className = 'row' + (first ? ' sel' : '');
      row.innerHTML = `<svg class="av" width="36" height="36" viewBox="0 0 48 48"><use href="#blob" fill="${color}"/><use href="#eyes" fill="#161616"/></svg>`
        + '<span class="txt">'
        + (first ? '<span class="name">Office Bot</span>' : `<span class="sk b" style="width:${nameWidth}px"></span>`)
        + `<span class="sk" style="width:${previewWidth}px"></span></span>`;
      list.append(row);
      first = false;
    }
  }
</script>
</body>
</html>
