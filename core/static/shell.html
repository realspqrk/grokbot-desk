<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>%%RS_WINDOW_TITLE%%</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/shell.css">
  <script id="rs-boot" type="application/json">%%RS_BOOT%%</script>
  <script src="/static/twitter-text-v3-data.js"></script>
  <script src="/static/count.js"></script>
  <script src="/static/rs.js"></script>
  <script src="/static/components.js"></script>
</head>
<body>
  <div class="rs-app">
    <header class="rs-header">
      <div class="rs-header__brand" data-rs-t="app_name"></div>
      <div class="rs-header__main">
        <h1 class="rs-header__title" id="rs-title" tabindex="-1"></h1>
        <p class="rs-header__meta" id="rs-meta"></p>
      </div>
      <div class="rs-header__tools">
        <button type="button" class="rs-btn rs-btn--quiet" id="rs-theme" aria-pressed="false" data-rs-t="theme"></button>
      </div>
    </header>

    <nav class="rs-rail" aria-labelledby="rs-rail-heading">
      <h2 class="rs-rail__heading" id="rs-rail-heading" data-rs-t="rail_heading"></h2>
      <ol class="rs-rail__list" id="rs-rail"></ol>
      <p class="rs-rail__empty" id="rs-rail-empty" data-rs-t="no_runs" hidden></p>
    </nav>

    <main class="rs-main">
      <div class="rs-mount" id="rs-mount"></div>
      <div class="rs-submitbar" id="rs-submitbar">
        <p class="rs-submitbar__status" id="rs-status"></p>
        <button type="button" class="rs-btn rs-btn--secondary" id="rs-discard" data-rs-t="discard"></button>
        <button type="button" class="rs-btn rs-btn--primary" id="rs-submit" aria-keyshortcuts="Control+Enter" disabled><span id="rs-submit-label" data-rs-t="submit"></span><span class="rs-kbd" data-rs-t="submit_shortcut"></span></button>
      </div>
    </main>

    <div class="rs-toasts" id="rs-toasts" role="status" aria-live="polite"></div>
  </div>

  <dialog class="rs-confirm__dialog" id="rs-discard-dialog" aria-labelledby="rs-discard-h" aria-describedby="rs-discard-t">
    <form class="rs-confirm__form" method="dialog">
      <h2 class="rs-confirm__heading" id="rs-discard-h" data-rs-t="discard_confirm_title"></h2>
      <p id="rs-discard-t" data-rs-t="discard_confirm_text"></p>
      <div class="rs-confirm__buttons">
        <button type="submit" class="rs-btn rs-btn--secondary" value="cancel" data-rs-t="cancel"></button>
        <button type="submit" class="rs-btn rs-btn--danger" value="discard" data-rs-t="discard"></button>
      </div>
    </form>
  </dialog>

  %%RS_TEMPLATES%%
</body>
</html>
